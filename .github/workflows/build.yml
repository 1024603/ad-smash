name: Build IPA

on: [push, workflow_dispatch]


jobs:

  build:

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v4


      - name: List files

        run: ls -R | head -50


      - name: Find project and scheme

        run: |

          PROJ=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" | head -1)

          echo "Found project: $PROJ"

          SCHEME=$(xcodebuild -list -json -project "$PROJ" | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")

          echo "Using scheme: $SCHEME"

          echo "PROJ=$PROJ" >> $GITHUB_ENV

          echo "SCHEME=$SCHEME" >> $GITHUB_ENV


      - name: Archive (unsigned)

        run: xcodebuild archive -project "$PROJ" -scheme "$SCHEME" -configuration Release -sdk iphoneos -archivePath build/app.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""


      - name: Create IPA

        run: |

          mkdir Payload

          cp -R build/app.xcarchive/Products/Applications/*.app Payload/

          zip -r AdSmash.ipa Payload


      - uses: actions/upload-artifact@v4

        with:

          name: AdSmash-ipa

          path: AdSmash.ipa
