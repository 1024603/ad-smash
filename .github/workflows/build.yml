name: Build IPA

on: [push, workflow_dispatch]


jobs:

  build:

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v4


      - name: Show schemes (for debugging)

        run: xcodebuild -list -project "Ad Smash!.xcodeproj"


      - name: Archive (unsigned)

        run: |

          xcodebuild archive \

            -project "Ad Smash!.xcodeproj" \

            -scheme "Ad Smash!" \

            -configuration Release \

            -sdk iphoneos \

            -archivePath build/app.xcarchive \

            CODE_SIGNING_ALLOWED=NO \

            CODE_SIGNING_REQUIRED=NO \

            CODE_SIGN_IDENTITY=""


      - name: Create IPA

        run: |

          mkdir Payload

          cp -R build/app.xcarchive/Products/Applications/*.app Payload/

          zip -r AdSmash.ipa Payload


      - uses: actions/upload-artifact@v4

        with:

          name: AdSmash-ipa

          path: AdSmash.ipa
